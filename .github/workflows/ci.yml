name: CI

on:
  # PR-gated: every change lands via a pull request, so validating the PR is
  # sufficient. Re-running on push to main just duplicates the same checks.
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Blacksmith runners report RUNNER_ENVIRONMENT=self-hosted, so setup-php
      # installs PHP from ondrej's PPA (~280 packages) instead of the prebuilt
      # tarball it uses on GitHub-hosted runners. That download goes through the
      # image's apt mirrorlist, whose first entry (mirror.arizona.edu) has been
      # serving ~1.8s per request, stretching Setup PHP from ~1m to ~9m. Drop it
      # from the list until it is healthy again.
      - name: Prefer a healthy apt mirror
        run: |
          mirrorlist=/etc/apt/blacksmith-ubuntu-mirrors.txt
          [ -f "$mirrorlist" ] || exit 0
          printf '%s\tpriority:%s\n' \
            'http://archive.ubuntu.com/ubuntu/' 1 \
            'http://mirrors.sonic.net/ubuntu/' 2 \
            | sudo tee "$mirrorlist" >/dev/null

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run test suite
        run: composer test
